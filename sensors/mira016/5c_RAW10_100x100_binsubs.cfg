local ybin_shift = 928
function setAnalogRowTiming(val)
	if val > 0 then
		halt_stream()
		initRegister("ROW_LENGTH",5001) -- large enough to avoid side effects
		initRegister("POS_ANACOL_TRIGGER", val)
		initRegister("POS_YADDR_TRIGGER", val+9)
		initRegister("POS_ADC_TRIGGER", val+151)
		initRegister("POS_ANACOL_YBIN_TRIGGER", val+ybin_shift)
		initRegister("POS_YADDR_YBIN_TRIGGER", val+ybin_shift+9)
		initRegister("POS_ADC_YBIN_TRIGGER", val+ybin_shift+151)
		start_stream()
	end
end
