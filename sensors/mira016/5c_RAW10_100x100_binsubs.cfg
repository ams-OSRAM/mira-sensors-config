======CODE_BLOCK_START======
function panX(val)
  	if (getSelectedMode() == "cropped") then
		halt_stream()
		prepContext()
		if (getRegister("XMIRROR") == 1) then
			adjustRegister("XWIN_LEFT", -val)
			adjustRegister("XWIN_RIGHT", -val)
		else
			adjustRegister("XWIN_LEFT", val)
			adjustRegister("XWIN_RIGHT", val)
		end
		start_stream()
	end
end

