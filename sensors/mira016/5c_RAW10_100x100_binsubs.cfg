[control parameter]
MIN_VALUE   = 0
MAX_VALUE   = 1
STEP        = 1
DEF 		= 0
CTRL_NAME	= Context switch
FUNC_NAME	= switchContext
======CODE_BLOCK_START======
local activeContext = "A"
local inactiveContext = "B"
local applyToCurrentContext = 1

function allowLiveUpdates(val)
	applyToCurrentContext = val
end

function switchContext(val)
	setRegister("NEXT_ACTIVE_CONTEXT", val)
	if val == 1 then
	  inactiveContext = "A"
	  activeContext = "B"
	else
	  inactiveContext = "B"
	  activeContext = "A"
	end
end

function prepContext()
	-- figures out which context to write to 
	-- (note: bank select is already handled in setRegister)
	-- (note: we cannot use setRegister here as it would create infinite recursive loop)
	if ((applyToCurrentContext == 1 and activeContext =="A") or 
	 	(applyToCurrentContext == 0 and activeContext =="B")) then
		writeReg(0xE004, 0) -- WRITE_CONTEXT 
	else
		writeReg(0xE004, 1) -- WRITE_CONTEXT
	end
end

======CODE_BLOCK_END======

