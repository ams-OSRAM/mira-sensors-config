CTRL_NAME	= DEBUG: Shift analog readout (relative)
FUNC_NAME	= shiftAnalogReadout
======CODE_BLOCK_START======
function shiftAnalogReadout(val)
	if (getDebugLock() == "unlocked") then
		halt_stream()
		adjustRegister("POS_ANACOL_TRIGGER", val)
		adjustRegister("POS_ADC_TRIGGER", val)
		adjustRegister("POS_ANACOL_YBIN_TRIGGER", val)
		adjustRegister("POS_ADC_YBIN_TRIGGER", val)
		start_stream()
	end
end
