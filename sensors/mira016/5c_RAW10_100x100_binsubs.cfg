;**************************************************************************************/
; ----- board parameter -----
;
; -- Keyname description:
; VRCMD = set board parameter by vendor command 
; 
; -- Keyname format:
; VRCMD = <command>, <value>, <index>, <dataNumber>[, <data1>[, <data2>[, <data3>[, <data4>]]]] 		//<comment>
;
; <command>     
; <value>      
; <index>         
; <dataNumber>  
; <dataN>      
; <comment>    Some form of C-style comments are supported in this .cfg file
;
;**************************************************************************************/
[board parameter]
VRCMD = 0xD7, 0x4600, 0x0100, 1, 0x80

;bit[7]：Data bit width mode 0：8 bit（Default）；1：16 bit
;bit[6]：Is clock provided to MIPI camera (24MHz) 0：Off（Default）；1：On
;bit[5]：DVP Camera pclk polarity 0：normal；1：inverse
;bit[4]：ircut 0：on；1：off
;bit[3]：DVP Camera standby 0：normal；1：standby
;bit[2]：DVP Camera rst_n 0：rst；1：normal
;bit[1]：MIPI Camera standby 0：normal；1：standby

; 8 bit => 0x
; 10 or 12 bit  => 1000 0000   => 0x80


VRCMD = 0xD7, 0x4600, 0x0200, 1, 0x00
VRCMD = 0xD7, 0x4600, 0x0300, 1, 0xC0
VRCMD = 0xD7, 0x4600, 0x0300, 1, 0x40
VRCMD = 0xD7, 0x4600, 0x0400, 1, 0x00
VRCMD = 0xD7, 0x4600, 0x0A00, 1, 0x02
VRCMD = 0xD7, 0x4600, 0x0C00, 1, 0x90    ; 1 lane  - RAW10


;bit[7]:Camera Selection 0:DVP Camera；1：MIPI Camera
;bit[5:4]：MIPI RAW format 0：raw8；1：raw10；2：raw12.
;bit[1:0]：MIPI channel 0:1Lane；1:2Lane；2:4Lane.
; 1 0 01 00 00 = > 10 bit mipi 1 channel => 0x90
; 1 0 00 00 00 = > 8 bit mipi 1 channel  => 0x80
; 1 0 10 00 00 = > 12 bit mipi 1 channel  => 0xA0



VRCMD = 0xD7, 0x4600, 0x0D00, 1, 0x00    ; Mipi , image resolution, column, High 8 bits 
VRCMD = 0xD7, 0x4600, 0x0E00, 1, 0x64    ; Mipi , image resolution, column, Low 8 bits     
VRCMD = 0xD7, 0x4600, 0x0F00, 1, 0x00    ; Mipi , image resolution, Row, High 8 bits 
VRCMD = 0xD7, 0x4600, 0x1000, 1, 0x64    ; Mipi , image resolution, Row, Low 8 bits 		
VRCMD = 0xD7, 0x4600, 0x1100, 1, 0x01	 ; checksum MIPI, 0x03 means off 0x01 is really off, no need for checking   , probably 0x01 works best , all off and crapy image 
VRCMD = 0xD7, 0x4600, 0x2300, 1, 0x01
VRCMD = 0xD7, 0x4600, 0x2900, 1, 0x00


