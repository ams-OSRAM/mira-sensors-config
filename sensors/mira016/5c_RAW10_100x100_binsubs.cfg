======CODE_BLOCK_START======
function xmirror(val)
	setRegister("XMIRROR", val)
end
function yflip(val)
	halt_stream() -- avoid changing halfway an image during streaming
	setRegister("YWIN_DIR", val)
	local shift
	if getSelectedMode() == "cropped" then
		shift = 150
	else
		shift = 0
	end
	if val == 1 then
	    initRegister("YWIN1_START", 413-shift)
	else
		initRegister("YWIN1_START", 14+shift)
	end 
	start_stream()
end
function setXYOrientation(val)
   if val == 0 then
		xmirror(0)
		yflip(0)
	elseif val == 1 then
		xmirror(1)
		yflip(0)
	elseif val == 2 then
		xmirror(1)
		yflip(1)
	elseif val == 3 then
		xmirror(0)
		yflip(1)
   end
end
======CODE_BLOCK_END======

