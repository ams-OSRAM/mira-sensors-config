;10b cleaned up**************************************************************************************/
; ----- camera parameter -----
;
; -- Keyname description:
; CFG_MODE  = set the config mode for camera: 0 -> User define(UI)
;											  1 -> This config File
; TYPE      = set the name of the camera module
; VID		= set the Vendor ID of camera
; SIZE		= set the width and height of the image generated by camera 
; BIT_WIDTH = set the bit width of the image generated by camera 
; FORMAT    = set the format of the image generated by camera:
;							 | 0 -> RAW	   | 1 -> RGB565  |	2 -> YUV422   | 3 -> JPG  |
;							 | -- 0 -> RG  | -- 0 -> RGB  | -- 0 -> YUYV  |           |
;							 | -- 1 -> GR  | -- 1 -> BGR  | -- 1 -> YVYU  |           |
;							 | -- 2 -> GB  |              | -- 2 -> UYVY  |           |
;							 | -- 3 -> BG  |              | -- 3 -> VYUY  |           |
; I2C_MODE  = set the bit width of the address and data of I2C communication: 
;																							0 ->  8 bit address &  8 bit value				
;																						  	1 ->  8 bit address & 16 bit value
;																							2 -> 16 bit address &  8 bit value
;																							3 -> 16 bit address & 16 bit value		
; I2C_ADDR  = set the ship address for register config of camera 
; 
; -- Keyname format:
; CFG_MODE  	= <value1>							;<comment>
; TYPE      	= <value1>
; VID			= <vid>
; SIZE			= <width>, <height>
; BIT_WIDTH 	= <bitWidth>
; FORMAT    	= <value1>[, <value2>]
; I2C_MODE  	= <value1>
; I2C_ADDR  	= <i2cAddress> 
;
; <valueN>		Index value representing certain meanings 
; <vid>			Vendor ID of the camera
; <width>		Width of the image generated by camera
; <height>		Height of the image generated by camera
; <bitWidth>	Bit width of the image generated by camera
; <i2cAddress>	Ship address for register config of camera
; <comment>    	Some form of C-style comments are supported in this .cfg file
;
;**************************************************************************************/
[camera parameter]
CFG_MODE  = 0	
TYPE      = Mira016
SIZE      = 100, 100
BIT_WIDTH = 10
FORMAT    = 4, 0 ;0, 2
I2C_MODE  = 2					
I2C_ADDR  = 0x6C
;TRANS_LVL = 128

; note: control parameter function code is Lua

[control parameter]
MIN_VALUE   = 0
MAX_VALUE   = 4
STEP        = 1
DEF 		= 0
CTRL_NAME	= Image mode (1: cropped, 2: subsampled, 3: subsampled and binned, 4: experiment)
FUNC_NAME	= set_image_mode
======CODE_BLOCK_START======
local selected_mode = "binned"  -- cropped, subsampled, binned

function getSelectedMode()
	return selected_mode
end

function set_image_mode(val)
	-- this one summarizes the delta for the different 200x200 modes, relative to the default full frame timing settings
	-- and also all the deltas versus the other modes so you can toggle back!
	if val > 0 then 
		halt_stream()
		prepContext() -- here be context banks!
		-- totally common registers here?
		initRegister("YWIN_ENA",2) -- avoid YWIN0 bug (Jira PROJ1939-74...) only use YWIN1
		initRegister("MIPI_DATA_FIFO_THRESHOLD", 64) -- fix bug where it was set too low in some modes
		initRegister("OFFSET_CLIPPING", 1046)
	end
	if val == 1 then
		-- cropped (intially centered)
		selected_mode = "cropped"
	
		initRegister("XWIN_LEFT", 164)
		initRegister("XWIN_RIGHT", 263)
		initRegister("XSUBSAMPLING", 0)
		initRegister("XBINNING", 0)
		
		if (getRegister("YWIN_DIR") == 1) then
			initRegister("YWIN1_START", 263)
		else
			initRegister("YWIN1_START", 164)
		end
		initRegister("YWIN1_SIZE", 100)
		initRegister("YWIN1_SUBS", 0)
		initRegister("YBINNING", 0)

	elseif val == 2 then
		-- subsampling (1/4)
	 selected_mode = "subsampled"
	 initRegister("XWIN_LEFT", 14)
	 initRegister("XWIN_RIGHT", 413)
	 initRegister("XSUBSAMPLING", 2)
	 initRegister("XBINNING", 0)
	 
	 if (getRegister("YWIN_DIR") == 1) then
		 initRegister("YWIN1_START", 413)
	 else
		 initRegister("YWIN1_START", 14)
	 end
	 initRegister("YWIN1_SIZE", 100) -- subs
	 initRegister("YWIN1_SUBS", 2)
	 initRegister("YBINNING", 0)

	elseif val == 3 then
	   	-- binning (1/2) and subsampling (1/2)
		selected_mode = "binned"
		initRegister("XWIN_LEFT", 14)
		initRegister("XWIN_RIGHT", 413)
		initRegister("XSUBSAMPLING", 1)
		initRegister("XBINNING", 1)
		
		if (getRegister("YWIN_DIR") == 1) then
			initRegister("YWIN1_START", 413)
		else
			initRegister("YWIN1_START", 14)
		end
		initRegister("YWIN1_SIZE", 200) -- subs & binning
		initRegister("YWIN1_SUBS", 1)
		initRegister("YBINNING", 1)

	elseif val == 4 then
		-- combination of different subsampling 
	 selected_mode = "subsampled_fun"
	 initRegister("XWIN_LEFT", 14)
	 initRegister("XWIN_RIGHT", 413)
	 initRegister("XSUBSAMPLING", 2)
	 initRegister("XBINNING", 0)
	 
	 if (getRegister("YWIN_DIR") == 1) then
		 initRegister("YWIN1_START", 413)
	 else
		 initRegister("YWIN1_START", 14)
	 end
	 initRegister("YWIN_ENA", 62) 
	 initRegister("YWIN1_SIZE", 10) -- no subs 
	 initRegister("YWIN1_SUBS", 0)
	 initRegister("YWIN2_SIZE", 20) -- 1/2 subs
	 initRegister("YWIN2_SUBS", 1)
	 initRegister("YWIN3_SIZE", 25) -- 1/8 subs
	 initRegister("YWIN3_SUBS", 3)
	 initRegister("YWIN4_SIZE", 35) -- 1/4 subs
	 initRegister("YWIN4_SUBS", 2)
	 initRegister("YWIN5_SIZE", 10) -- no subs
	 initRegister("YWIN5_SUBS", 0)
	 initRegister("YWIN2_START", 413-10)
	 initRegister("YWIN3_START", 413-50)
	 initRegister("YWIN4_START", 413-250)
	 initRegister("YWIN5_START", 413-390)


	 initRegister("YBINNING", 0)

	end
	
	-- GDIG stepsize and unity gain depends on bit mode and binning
	if selected_mode == "binned" then
		initRegister("GDIG_AMP", 3) -- steps of 0.25
		setAnalogRowTiming(51)
		setDigitalRowTiming(19)
		initRegister("ROW_LENGTH", 1970)

	else -- cropped/subsampled
		initRegister("GDIG_AMP", 7) -- steps of 0.125
		setAnalogRowTiming(1)
		setDigitalRowTiming(200) -- 5-200 range (200 is equivalent to 250 in 8b)
		initRegister("ROW_LENGTH", 980) -- WHY longer than 8b? 

	end
	
	if val > 0 then 
		start_stream()
	end 
end

function writeMultiByteReg(startAddr, value, numBytes)
	local bigEndian = true -- Set endianness: true = big-endian, false = little-endian
    for i = 0, numBytes - 1 do
        local shift = bigEndian and ((numBytes - 1 - i) * 8) or (i * 8)
        local byte = (value >> shift) & 0xFF
        writeReg(startAddr + i, byte)
    end
end

-- note: bank is 0 by default (no need to declare)
-- initial : the base value for a certain mode (after initRegister) Not updated by setRegister, nor by adjustRegister.
-- value : the current value (after initRegister or setRegister), also the final value after any adjustements to the initial value (after adjustRegister)

registers = {
    XWIN_LEFT  = {bank = 1, addr = 0xE02C, bytes = 2},
    XWIN_RIGHT = {bank = 1, addr = 0xE02E, bytes = 2},
    XSUBSAMPLING = {bank = 1, addr = 0xE025, bytes = 1},
    XBINNING = {bank = 1, addr = 0xE02A, bytes = 1},
	XMIRROR = {bank = 1, addr = 0xE030, bytes = 1},
    YBINNING = {bank = 1, addr = 0x002B, bytes = 1},
    ROW_LENGTH = {bank = 1, addr = 0x0032, bytes = 2},
    OFFSET_CLIPPING = {bank = 0, addr = 0x193, bytes = 2},
	YWIN1_SIZE = {addr = 0x0029, bytes = 2},
    YWIN1_START = {addr = 0x002B, bytes = 2},
    YWIN1_SUBS = {addr = 0x002D, bytes = 1},
	YWIN2_SIZE = {addr = 0x002E, bytes = 2},
    YWIN2_START = {addr = 0x0030, bytes = 2},
    YWIN2_SUBS = {addr = 0x0032, bytes = 1},
	YWIN3_SIZE = {addr = 0x0033, bytes = 2},
    YWIN3_START = {addr = 0x0035, bytes = 2},
    YWIN3_SUBS = {addr = 0x0037, bytes = 1},
	YWIN4_SIZE = {addr = 0x0038, bytes = 2},
    YWIN4_START = {addr = 0x003A, bytes = 2},
    YWIN4_SUBS = {addr = 0x003C, bytes = 1},
	YWIN5_SIZE = {addr = 0x003D, bytes = 2},
    YWIN5_START = {addr = 0x003F, bytes = 2},
    YWIN5_SUBS = {addr = 0x0041, bytes = 1},
	YWIN_DIR = {addr = 0x0023, bytes = 1},
	YWIN_ENA = {bank = 1, addr = 0x001E, bytes = 2},
	POS_YADDR_TRIGGER = {addr = 0x031F, bytes = 2},
	POS_YADDR_YBIN_TRIGGER = {addr = 0x0321, bytes = 2},
	POS_ANACOL_TRIGGER = {addr = 0x01A2, bytes = 2},
	POS_ANACOL_YBIN_TRIGGER = {addr = 0x01A4, bytes = 2},
	POS_ADC_TRIGGER = {addr = 0x01A6, bytes = 2},
	POS_ADC_YBIN_TRIGGER = {addr = 0x01A8, bytes = 2},
	POS_VIS_TRIGGER = {addr = 0x01A0, bytes = 2},
	POS_HSYNC_RISE = {addr = 0x01B2, bytes = 2},
	GDIG_AMP = {bank = 1, addr = 0x0024, bytes=1},
	BIAS_RG_ADCGAIN = {addr = 0x01F0, bytes = 1},
	EXP_TIME_L = {bank = 1, addr = 0x000F, bytes=3},
	PARAM_HOLD = {addr = 0x0006, bytes = 1},
	WRITE_CONTEXT = {addr = 0xE004, bytes = 1},
	NEXT_ACTIVE_CONTEXT = {addr = 0xE003, bytes = 1},
	CMD_HALT_BLOCK = {addr = 0xE00C, bytes =1},
	CMD_REQ_EXP = {addr = 0xE00A, bytes = 1},
	MIPI_DATA_FIFO_THRESHOLD = {bank=1, addr = 0x2029, bytes = 1 },
	EOB_TARGET = { addr = 0x005C, bytes = 2 },
	EN_SEQUENTIAL_READOUT = {addr = 0x0318 , bytes = 1},
	POS_READOUT_TRIGGER = { addr = 0x0319, bytes = 2},
	POS_STAT_TRIGGER = {addr = 0x01B0, bytes = 2},
	POS_SVAL_TRIGGER = {addr = 0x01AC, bytes = 2}
}
local currentBank 
function selectBank(val)
  writeReg(0xE000,val) --BANK_SEL: direct write (instead of setRegister) to avoid endless recursion
  currentBank = val -- problem: this does not track direct writes to 0xE000 elsewhere, but that is OK... 
  					-- If we limit the use to handling the tuning sliders in [control parameter] blocks,
  					-- we should be OK to rely on currentBank to optimize the accesses.
end

function getBank(name)
  	local reg = registers[name]
  	if reg.bank == nil then
    	return 0  -- implicit default bank 0 
	else
		return reg.bank
	end
end

function setRegister(name, value)
-- updates the register (state) table AND writes the actual HW register
    local reg = registers[name]
   -- If initial has not been set yet, treat this as initialization
    if reg.initial == nil then
        reg.initial = value
    end
    reg.value = value
	-- switch banks if necessary
	local newbank = getBank(name)
	if (newbank ~= currentBank) then
		selectBank(newbank)
	end
	-- prepare which context bank to select 
	if newbank > 0 then
		prepContext()
	end
	-- if it is a multi-byte register, use PARAM HOLD to avoid transients
	if (reg.bytes > 1) then
		setParamHold(1)
	end
	-- finally, do the register write
    writeMultiByteReg(reg.addr, value, reg.bytes)
	if (reg.bytes > 1) then
		setParamHold(0)
	end
end
function getRegister(name) 
    -- generic 'reading' of a register value (from the register state table. Not from the HW register, which seems not supported through readReg)
	local reg = registers[name]
	return reg.value or 0
end
function adjustRegister(name, delta)
  -- incrementally change the register value from its initial value (not current value, to allow interactive sliders)
    local reg = registers[name]
	setRegister(name, (reg.initial or 0) + delta)
end
function initRegister(name, value)
    -- set and remembers the base value of a register for future adjusting
    registers[name].initial = value
    setRegister(name, value)
end
-- note: all functions match *tRegister, making some grepping easier

function setParamHold(val)
	writeReg(0x0006, val) -- PARAM_HOLD (again: to avoid endless recursion, we cannot use the named setRegister here)
end

