function halt_stream() -- for use in other functions
	setRegister("CMD_HALT_BLOCK", 1)
	setRegister("CMD_HALT_BLOCK", 0)
end

function start_stream() -- for use in other functions
	setRegister("CMD_REQ_EXP", 1)
	setRegister("CMD_REQ_EXP", 0)
end

function start_or_stop_stream(val)
	-- complementary setting to have single control slider
	setRegister("CMD_HALT_BLOCK", ~val) 
	setRegister("CMD_HALT_BLOCK", 0)
	setRegister("CMD_REQ_EXP", val)
	setRegister("CMD_REQ_EXP", 0)
end
