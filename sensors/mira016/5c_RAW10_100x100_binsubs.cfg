======CODE_BLOCK_START======
function setRowTiming(val)
	if (getDebugLock() == "unlocked") then
		if val > 0 then
			halt_stream()
		end
		initRegister("ROW_LENGTH",2500) -- large enough to avoid side effects?
		if val == 1 then -- API settings (one size fits all?)
			initRegister("POS_YADDR_TRIGGER", 10)
			initRegister("POS_ANACOL_TRIGGER", 1)
			initRegister("POS_ADC_TRIGGER", 152)
			initRegister("POS_YADDR_YBIN_TRIGGER", 944)
			initRegister("POS_ANACOL_YBIN_TRIGGER", 935)
			initRegister("POS_ADC_YBIN_TRIGGER", 1086)
			initRegister("POS_VIS_TRIGGER", 200)
			initRegister("POS_HSYNC_RISE", 226)
		elseif val == 2 then -- (emperically found settinggs that ONLY work with binning. When applied to cropped or subs, it freezes and then leaves bad first bottom row when switching back to 1 or 3. Even when changing the orientation. This suggests something maps incorrectly in the arducam buffer?)
			initRegister("POS_YADDR_TRIGGER", 60)
			initRegister("POS_ANACOL_TRIGGER", 51)
			initRegister("POS_ADC_TRIGGER", 202)
			initRegister("POS_YADDR_YBIN_TRIGGER", 944)
			initRegister("POS_ANACOL_YBIN_TRIGGER", 985)
			initRegister("POS_ADC_YBIN_TRIGGER", 1136)
			initRegister("POS_VIS_TRIGGER", 10)
			initRegister("POS_HSYNC_RISE", 36)
		elseif val == 3 then -- ANA from binning and DIG from orig works fine for non-binned modes too
			initRegister("POS_YADDR_TRIGGER", 60)
			initRegister("POS_ANACOL_TRIGGER", 51)
			initRegister("POS_ADC_TRIGGER", 202)
			initRegister("POS_YADDR_YBIN_TRIGGER", 944)
			initRegister("POS_ANACOL_YBIN_TRIGGER", 985)
			initRegister("POS_ADC_YBIN_TRIGGER", 1136)
			initRegister("POS_VIS_TRIGGER", 200)
			initRegister("POS_HSYNC_RISE", 226)
		end
		if val > 0 then
			start_stream()
		end
	end
end
